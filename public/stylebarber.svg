<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="barberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f06" />
      <stop offset="50%" stop-color="#221808" />
      <stop offset="100%" stop-color="#0a0703" />
    </linearGradient>
    <linearGradient id="barberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="barberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#barberBg)" />
  <circle cx="400" cy="220" r="200" fill="#F59E0B" opacity="0.12" filter="blur(70px)" />

  <rect x="180" y="85" width="440" height="290" rx="20" fill="url(#barberCard)" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5" />

  <circle cx="215" cy="120" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="230" cy="120" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="245" cy="120" r="5" fill="#10B981" opacity="0.8" />
  <text x="400" y="125" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#FCD34D" letter-spacing="3">STYLEBARBER // BOOKING &amp; QUEUE</text>

  <!-- Barber Booking Mockup -->
  <g transform="translate(220, 155)">
    <!-- Barber card 1 -->
    <rect x="0" y="0" width="170" height="135" rx="12" fill="#0c0803" stroke="#F59E0B" stroke-opacity="0.25" />
    <circle cx="85" cy="40" r="24" fill="url(#barberGrad)" />
    <text x="85" y="47" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#140f06">✂</text>
    <text x="85" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#FEF3C7">Fade &amp; Beard Trim</text>
    <text x="85" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#F59E0B">Rp 55.000 • 45 Mnt</text>

    <!-- Schedule box 2 -->
    <rect x="190" y="0" width="170" height="135" rx="12" fill="#0c0803" stroke="#F59E0B" stroke-opacity="0.25" />
    <text x="275" y="30" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#9CA3AF">PILIH JADWAL</text>
    <rect x="205" y="45" width="140" height="30" rx="8" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="1" />
    <text x="275" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FCD34D">Hari Ini, 16:30 WIB</text>
    <rect x="205" y="85" width="140" height="34" rx="8" fill="url(#barberGrad)" />
    <text x="275" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#140f06">BOOKING SEKARANG</text>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">StyleBarber</text>
  <text x="400" y="450" text-anchor="middle" font-family="monospace" font-size="12" fill="#FCD34D" letter-spacing="2">NEXT.JS • REACT 19 • PRISMA ORM</text>
</svg>
