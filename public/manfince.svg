<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c14" />
      <stop offset="50%" stop-color="#0a2e22" />
      <stop offset="100%" stop-color="#04120c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid lines subtle -->
  <g stroke="#10b981" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Glow circle -->
  <circle cx="400" cy="220" r="180" fill="#10B981" opacity="0.12" filter="blur(60px)" />

  <!-- Center Card UI -->
  <rect x="180" y="90" width="440" height="280" rx="20" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Card Header -->
  <circle cx="215" cy="125" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="230" cy="125" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="245" cy="125" r="5" fill="#10B981" opacity="0.8" />
  <text x="400" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#6EE7B7" letter-spacing="2">MANFINCE // PERSONAL FINANCE</text>

  <!-- Balance Box inside Card -->
  <rect x="210" y="155" width="380" height="75" rx="12" fill="#04120c" stroke="#10b981" stroke-opacity="0.2" />
  <text x="235" y="182" font-family="sans-serif" font-size="12" fill="#9CA3AF">Total Saldo Terkelola</text>
  <text x="235" y="214" font-family="sans-serif" font-size="24" font-weight="800" fill="#ECFDF5">Rp 24.850.000</text>
  <rect x="480" y="175" width="90" height="32" rx="16" fill="url(#accentGrad)" />
  <text x="525" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#04120c">+ 18.4%</text>

  <!-- Mini Chart / Columns -->
  <g transform="translate(210, 250)">
    <!-- 4 mini bars -->
    <rect x="10" y="55" width="65" height="35" rx="6" fill="#10B981" opacity="0.3" />
    <rect x="85" y="35" width="65" height="55" rx="6" fill="#10B981" opacity="0.5" />
    <rect x="160" y="20" width="65" height="70" rx="6" fill="#10B981" opacity="0.8" />
    <rect x="235" y="10" width="65" height="80" rx="6" fill="url(#accentGrad)" />
    <rect x="310" y="30" width="65" height="60" rx="6" fill="#10B981" opacity="0.6" />
  </g>

  <!-- Big Brand Title at Bottom -->
  <text x="400" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">Manfince</text>
  <text x="400" y="450" text-anchor="middle" font-family="monospace" font-size="12" fill="#6EE7B7" letter-spacing="2">NEXT.JS 16 • REACT 19 • TAILWIND CSS</text>
</svg>
