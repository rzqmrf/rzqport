<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="posBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e24" />
      <stop offset="50%" stop-color="#0f1c3d" />
      <stop offset="100%" stop-color="#050817" />
    </linearGradient>
    <linearGradient id="posGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="posCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#posBg)" />

  <!-- Glow -->
  <circle cx="400" cy="220" r="200" fill="#3B82F6" opacity="0.12" filter="blur(70px)" />

  <!-- Center Card -->
  <rect x="180" y="85" width="440" height="290" rx="20" fill="url(#posCardGrad)" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Window dots -->
  <circle cx="215" cy="120" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="230" cy="120" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="245" cy="120" r="5" fill="#10B981" opacity="0.8" />
  <text x="400" y="125" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#93C5FD" letter-spacing="3">POINT OF SALE // KASIR DIGITAL</text>

  <!-- POS Terminal Mockup -->
  <g transform="translate(220, 150)">
    <!-- Left receipt summary -->
    <rect x="0" y="0" width="180" height="150" rx="10" fill="#040817" stroke="#3B82F6" stroke-opacity="0.25" />
    <text x="18" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Order #TRX-8821</text>
    <line x1="18" y1="40" x2="162" y2="40" stroke="#3B82F6" stroke-opacity="0.2" />
    
    <text x="18" y="65" font-family="sans-serif" font-size="10" fill="#94A3B8">3x Item Coffee Latte</text>
    <text x="162" y="65" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">66K</text>

    <text x="18" y="90" font-family="sans-serif" font-size="10" fill="#94A3B8">1x Pastry Croissant</text>
    <text x="162" y="90" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">28K</text>

    <line x1="18" y1="105" x2="162" y2="105" stroke="#3B82F6" stroke-opacity="0.2" />
    <text x="18" y="130" font-family="sans-serif" font-size="11" font-weight="700" fill="#60A5FA">Total: 94.000</text>

    <!-- Right Quick Pay Button & Scanner -->
    <rect x="195" y="0" width="165" height="70" rx="10" fill="url(#posGrad)" />
    <text x="277" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">BAYAR QRIS / CASH</text>
    <text x="277" y="52" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#BFDBFE">Proses Cepat 1 Detik</text>

    <rect x="195" y="80" width="165" height="70" rx="10" fill="#040817" stroke="#3B82F6" stroke-opacity="0.25" />
    <text x="277" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Inventori Stok Real-time</text>
    <text x="277" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#10B981">● 142 Produk Siap Jual</text>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">Sistem Kasir POS</text>
  <text x="400" y="450" text-anchor="middle" font-family="monospace" font-size="12" fill="#93C5FD" letter-spacing="2">LARAVEL • INERTIA.JS • REACT • TAILWIND</text>
</svg>
